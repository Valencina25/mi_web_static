services:
  - type: web
    name: mi-web-static
    env: node
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mi-web-db
          property: connectionString

databases:
  - name: mi-web-db
    databaseName: mi_web_db
    user: mi_web_user
    plan: free
