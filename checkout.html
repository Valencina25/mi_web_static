<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">🌱 Huerto</a>
            <a href="carrito.html">Carrito</a>
        </nav>
    </header>
    
    <main>
        <h1>Confirmar Pedido</h1>
        
        <p>Total: <strong id="total">0 €</strong></p>
        
        <form id="form">
            <input type="text" id="nombre" placeholder="Nombre completo" required>
            <input type="tel" id="telefono" placeholder="Teléfono" required>
            <textarea id="direccion" placeholder="Dirección" required></textarea>
            <button type="submit">Confirmar</button>
        </form>
    </main>
    
    <script>
        const carousel = JSON.parse(localStorage.getItem('carrito')) || [];
        const total = carousel.reduce((a, p) => a + (p.precio * (p.cantidad || 1)), 0);
        document.getElementById('total').textContent = total.toFixed(2) + ' €';
        
        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                productos: carousel,
                total,
                nombre: document.getElementById('nombre').value,
                telefono: document.getElementById('telefono').value,
                direccion: document.getElementById('direccion').value
            };
            
            await fetch('/api/pedidos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            localStorage.setItem('carrito', '[]');
            alert('Pedido enviado!');
            location.href = '/index.html';
        });
    </script>
</body>
</html>
