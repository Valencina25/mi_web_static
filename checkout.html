<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Confirmado - Huerto de Juan</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div id="flash-container" class="flash-messages" role="alert" aria-live="polite"></div>

    <main class="section" style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
        <div class="container" style="max-width: 500px; text-align: center;">
            <div id="checkout-section">
                <div class="producto" style="padding: var(--space-2xl);">
                    <span style="font-size: 4rem; display: block; margin-bottom: var(--space-lg);">🛒</span>

                    <h1 style="margin-bottom: var(--space-md);">Finalizar Compra</h1>

                    <p style="font-size: var(--text-lg); margin-bottom: var(--space-lg);">
                        Total a pagar: <strong><span id="checkout-total">0</span> €</strong>
                    </p>

                    <button id="checkout-btn" class="btn btn-primary" style="margin-top: var(--space-lg);">
                        ✅ Confirmar Pedido
                    </button>

                    <p style="text-align: center; margin-top: var(--space-md);">
                        <a href="carrito.html" style="color: var(--color-primary);">← Volver al carrito</a>
                    </p>
                </div>
            </div>

            <div id="checkout-success" class="producto" style="padding: var(--space-2xl); display: none;">
                <span style="font-size: 4rem; display: block; margin-bottom: var(--space-lg);">✅</span>

                <h1 style="margin-bottom: var(--space-md);">¡Pedido Confirmado!</h1>

                <p style="font-size: var(--text-lg); margin-bottom: var(--space-lg);">
                    Gracias por tu compra. Tus productos ecológicos van en camino 🚚
                </p>

                <p class="producto-precio" style="font-size: var(--text-2xl);">
                    Total: <span id="checkout-total-confirmed">0</span> €
                </p>

                <a href="index.html" class="btn btn-primary" style="margin-top: var(--space-xl);">
                    🛒 Seguir Comprando
                </a>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('checkout-total-confirmed').textContent = 
            document.getElementById('checkout-total').textContent;
    </script>

</body>
</html>
