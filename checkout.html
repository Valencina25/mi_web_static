<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Checkout - Huerto de Juan</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">🌱 Huerto</a>
            <a href="carrito.html">🛒 Carrito</a>
        </nav>
    </header>
    
    <main style="padding: 20px; max-width: 500px; margin: 0 auto;">
        <h1>📝 Confirmar Pedido</h1>
        
        <p>Total a pagar: <strong id="total">0 €</strong></p>
        
        <form action="https://formspree.io/f/mwvazjng" method="POST" onsubmit="guardarLocal()">
            <input type="hidden" name="productos" id="productos">
            <input type="hidden" name="total" id="campo-total">

            <label>Nombre completo</label>
            <input type="text" name="nombre" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Teléfono</label>
            <input type="tel" name="telefono" required>

            <label>Dirección de entrega</label>
            <textarea name="direccion" required></textarea>

            <button type="submit">✅ Confirmar Pedido</button>
        </form>
        
        <div id="ok" style="display:none; text-align: center; padding: 20px;">
            <h2 style="color: green;">✅ Pedido Enviado!</h2>
            <p>Te enviaremos un email de confirmación.</p>
            <a href="index.html">Volver a la tienda</a>
        </div>
    </main>
    
    <script>
        const carousel = JSON.parse(localStorage.getItem('carrito')) || [];
        const total = carousel.reduce((a, p) => a + ((p.precio || 0) * (p.cantidad || 1)), 0);

        document.getElementById('total').textContent = total.toFixed(2) + ' €';
        document.getElementById('campo-total').value = total.toFixed(2) + ' €';
        document.getElementById('productos').value = carousel.map(p =>
            `${p.nombre || p.nombre} x${p.cantidad || 1} = ${((p.precio || 0) * (p.cantidad || 1)).toFixed(2)} €`
        ).join('\n');

        if (carousel.length === 0) {
            document.querySelector('form').innerHTML = '<p style="text-align:center;">Tu carrito está vacío</p><a href="index.html">Volver a la tienda</a>';
        }

        function guardarLocal() {
            const pedido = {
                id: Date.now(),
                name: document.querySelector('input[name="nombre"]').value,
                phone: document.querySelector('input[name="telefono"]').value,
                email: document.querySelector('input[name="email"]').value,
                address: document.querySelector('textarea[name="direccion"]').value,
                items: carousel.map(p => `${p.nombre} x${p.cantidad || 1}`),
                total: total,
                date: Date.now()
            };
            const pedidos = JSON.parse(localStorage.getItem('my_orders') || '[]');
            pedidos.unshift(pedido);
            localStorage.setItem('my_orders', JSON.stringify(pedidos));
            localStorage.removeItem('carrito');
        }
    </script>
</body>
</html>
