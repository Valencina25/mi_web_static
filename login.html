<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Admin</title>
    <style>
        body { font-family: Arial; padding: 50px; text-align: center; }
        input { padding: 10px; font-size: 18px; margin: 10px; width: 200px; }
        button { padding: 10px 20px; font-size: 18px; background: green; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔐 ADMIN</h1>
    <p>Contraseña: juan123</p>
    <br>
    <input type="password" id="pass" placeholder="Contraseña">
    <br>
    <button onclick="entrar()">ENTRAR</button>
    <br><br>
    <a href="index.html">← Volver a tienda</a>
    <script>
        function entrar() {
            var p = document.getElementById('pass').value;
            if (p === 'juan123') {
                location.href = 'admin.html';
            } else {
                alert('ERROR: Contraseña incorrecta');
            }
        }
    </script>
</body>
</html>
