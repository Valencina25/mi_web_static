<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin | Huerto de Juan</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div id="flash-container" class="flash-messages" role="alert" aria-live="polite"></div>

    <main class="section" style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
        <div class="container" style="max-width: 400px;">
            <div class="producto" style="padding: var(--space-xl);">
                <h1 class="section-title">🔐 Admin</h1>

                <form id="login-form">
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn btn-primary" style="margin-top: var(--space-md);">Entrar</button>
                </form>

                <p style="text-align: center; margin-top: var(--space-md);">
                    <a href="index.html" style="color: var(--color-primary);">← Volver a la tienda</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        const ADMIN_PASSWORD = 'juan123';

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            
            if (password === ADMIN_PASSWORD) {
                localStorage.setItem('admin_password', password);
                window.location.href = 'admin.html';
            } else {
                showFlash('Contraseña incorrecta', 'error');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const savedPwd = localStorage.getItem('admin_password');
            if (savedPwd === ADMIN_PASSWORD) {
                window.location.href = 'admin.html';
            }
        });
    </script>
</body>
</html>
