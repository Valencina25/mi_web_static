<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Huerto de Juan</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; background-color: #f5f5dc; }
        #login-area { text-align: center; padding: 80px 20px; }
        #login-area input { padding: 12px; font-size: 16px; width: 180px; margin: 10px 0; }
        #login-area button { padding: 12px 24px; font-size: 16px; background-color: #2d5a3d; color: white; border: none; cursor: pointer; }
        .main-content { display: none; }
        .product-card { background: white; padding: 15px; margin: 5px; border-radius: 8px; display: inline-block; text-align: center; width: 140px; }
        .order-card { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .btn-green { background-color: #2d5a3d; color: white; padding: 10px 20px; border: none; cursor: pointer; }
        .btn-red { background-color: #c0392b; color: white; padding: 8px 16px; border: none; cursor: pointer; }
        nav { margin-bottom: 20px; }
        nav a, nav button { margin-right: 10px; }
    </style>
</head>
<body>
    <div id="login-area">
        <h1>🔐 Admin - Entrar</h1>
        <input type="password" id="password" placeholder="Contraseña">
        <br>
        <button onclick="login()">Entrar</button>
    </div>
    
    <div id="main-area" class="main-content">
        <nav>
            <a href="index.html" style="background:#2d5a3d;color:white;padding:10px 20px;text-decoration:none;border-radius:4px;">🌱 Tienda</a>
            <button onclick="logout()" class="btn-red">🚪 Salir</button>
        </nav>
        
        <h2>📦 Productos</h2>
        <div id="products-list"></div>
        
        <details style="background:white;padding:15px;margin:10px 0;border-radius:8px;">
            <summary style="cursor:pointer;font-weight:bold;">➕ Añadir Producto</summary>
            <input type="text" id="prod-name" placeholder="Nombre" style="width:100%;padding:8px;margin:5px 0;">
            <input type="number" id="prod-price" placeholder="Precio" step="0.1" style="width:100%;padding:8px;margin:5px 0;">
            <select id="prod-cat" style="width:100%;padding:8px;margin:5px 0;">
                <option value="verduras">Verduras</option>
                <option value="frutas">Frutas</option>
            </select>
            <input type="text" id="prod-img" placeholder="img/foto.jpg" style="width:100%;padding:8px;margin:5px 0;">
            <button onclick="addProduct()" class="btn-green">Guardar</button>
        </details>
        
        <h2 style="margin-top:30px;">📋 Pedidos</h2>
        <button onclick="loadOrders()" class="btn-green">🔄 Recargar</button>
        <button onclick="clearOrders()" class="btn-red">Limpiar Todo</button>
        <div id="orders-list"></div>
    </div>
    
    <script>
        const PASS = 'juan123';
        const DEFAULT_PRODUCTS = [
            {id:2,name:'Pimiento',price:3,cat:'verduras',img:'img/pimiento italiano.jpg'},
            {id:3,name:'Cebollino',price:2,cat:'verduras',img:'img/cebollino.jpg'},
            {id:13,name:'Lechuga',price:1.5,cat:'verduras',img:'img/lechuga.jpg'},
            {id:18,name:'Fresa',price:5,cat:'frutas',img:'img/fresa.jpg'},
            {id:19,name:'Pera',price:2.8,cat:'frutas',img:'img/pera.jpg'}
        ];
        
        function getProds() { return JSON.parse(localStorage.getItem('my_products')) || DEFAULT_PRODUCTS; }
        function saveProds(p) { localStorage.setItem('my_products', JSON.stringify(p)); }
        
        function login() {
            if(document.getElementById('password').value === PASS) {
                sessionStorage.setItem('admin_logged', 'yes');
                document.getElementById('login-area').style.display = 'none';
                document.getElementById('main-area').style.display = 'block';
                renderProds();
                loadOrders();
            } else {
                alert('❌ Contraseña incorrecta');
            }
        }
        
        function logout() {
            sessionStorage.removeItem('admin_logged');
            location.reload();
        }
        
        function renderProds() {
            let p = getProds();
            document.getElementById('products-list').innerHTML = p.map((pr,i) =>
                '<div class="product-card"><b>'+pr.name+'</b><br>'+pr.price+'€<br><small>'+pr.cat+'</small><br><button onclick="delProd('+i+')" class="btn-red">🗑</button></div>'
            ).join('');
        }
        
        function addProduct() {
            let n = document.getElementById('prod-name').value;
            let pr = parseFloat(document.getElementById('prod-price').value);
            if(!n || !pr) return alert('Escribe nombre y precio');
            let p = getProds();
            p.push({id:Date.now(), name:n, price:pr, cat:document.getElementById('prod-cat').value, img:document.getElementById('prod-img').value || 'img/'+n.toLowerCase().replace(/ /g,'')+'.jpg'});
            saveProds(p);
            alert('✅ Guardado');
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-price').value = '';
            renderProds();
        }
        
        function delProd(i) {
            if(!confirm('Borrar?')) return;
            let p = getProds();
            p.splice(i,1);
            saveProds(p);
            renderProds();
        }
        
        function loadOrders() {
            let o = JSON.parse(localStorage.getItem('my_orders') || '[]');
            let d = document.getElementById('orders-list');
            if(o.length === 0) { d.innerHTML = '<p>No hay pedidos</p>'; return; }
            d.innerHTML = o.map((or,j) =>
                '<div class="order-card"><b>'+or.name+'</b> - '+or.phone+'<br>📧 '+(or.email||'-')+'<br>📍 '+or.address+'<br>📅 '+new Date(or.date||Date.now()).toLocaleString()+'<hr>'+(or.items||[]).map(it=>'<div>'+it+'</div>').join('')+'<div><b>Total: '+Number(or.total||0).toFixed(2)+'€</b></div><button onclick="delOrder('+j+')" class="btn-red">🗑</button></div>'
            ).join('');
        }
        
        function delOrder(j) {
            if(!confirm('Borrar pedido?')) return;
            let o = JSON.parse(localStorage.getItem('my_orders') || '[]');
            o.splice(j,1);
            localStorage.setItem('my_orders', JSON.stringify(o));
            loadOrders();
        }
        
        function clearOrders() {
            if(!confirm('Borrar TODOS los pedidos?')) return;
            localStorage.removeItem('my_orders');
            loadOrders();
        }
        
        // Check session
        if(sessionStorage.getItem('admin_logged') === 'yes') {
            document.getElementById('login-area').style.display = 'none';
            document.getElementById('main-area').style.display = 'block';
            renderProds();
            loadOrders();
        }
    </script>
</body>
</html>
