<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Huerto</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 900px; margin: 0 auto; background: #f5f5dc; }
        #login { text-align: center; padding: 100px 0; }
        #login input { padding: 10px; font-size: 18px; width: 200px; }
        #login button { padding: 10px 20px; font-size: 18px; background: #386641; color: white; border: none; cursor: pointer; }
        .pedido { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 20px 0; }
        .prod { background: #f5f5f5; padding: 10px; border-radius: 8px; text-align: center; }
        input, select { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; }
        button { background: #386641; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-rojo { background: #c0392b; }
    </style>
</head>
<body>
    <div id="login">
        <h1>🔐 Admin</h1>
        <br>
        <input type="password" id="pass" placeholder="••••••••">
        <br><br>
        <button onclick="entrar()">Entrar</button>
        <br><br>
        <a href="index.html" style="color:#386641;">← Volver a tienda</a>
    </div>
    
    <div id="admin" style="display: none;">
        <nav style="margin-bottom: 20px;">
            <a href="index.html" style="background:#386641;color:white;padding:10px 15px;text-decoration:none;border-radius:4px;">🌱 Tienda</a>
            <button onclick="cerrar()" class="btn-rojo" style="margin-left:10px;">Salir</button>
        </nav>
        
        <h2>📦 Productos</h2>
        <div class="grid" id="lista-prods"></div>
        
        <details style="background:white;padding:15px;border-radius:8px;">
            <summary style="cursor:pointer;font-weight:bold;">➕ Nuevo Producto</summary>
            <input type="text" id="new-nombre" placeholder="Nombre">
            <input type="number" id="new-precio" placeholder="Precio" step="0.1">
            <select id="new-cat"><option value="verduras">Verduras</option><option value="frutas">Frutas</option></select>
            <input type="text" id="new-img" placeholder="img/foto.jpg">
            <button onclick="nuevoProd()">Guardar</button>
        </details>
        
        <h2 style="margin-top:30px;">📋 Pedidos</h2>
        <button onclick="cargar()">Recargar</button>
        <button onclick="limpiarTodo()" class="btn-rojo">Limpiar</button>
        <div id="pedidos"></div>
    </div>
    
    <script>
        const password = 'juan123';
        
        const productosDefault = [
            { id:2,nombre:'pimiento italiano',precio:3,categoria:'verduras',imagen:'img/pimiento italiano.jpg' },
            { id:3,nombre:'cebollino',precio:2,categoria:'verduras',imagen:'img/cebollino.jpg' },
            { id:4,nombre:'berenjena morada',precio:2,categoria:'verduras',imagen:'img/berejena morada.jpg' },
            { id:13,nombre:'lechuga',precio:1.5,categoria:'verduras',imagen:'img/lechuga.jpg' },
            { id:18,nombre:'fresa',precio:5,categoria:'frutas',imagen:'img/fresa.jpg' },
            { id:19,nombre:'pera',precio:2.8,categoria:'frutas',imagen:'img/pera.jpg' }
        ];
        
        function getProductos() { return JSON.parse(localStorage.getItem('productos')) || productosDefault; }
        function guardarProds(ps) { localStorage.setItem('productos', JSON.stringify(ps)); }
        
        function entrar() {
            if (document.getElementById('pass').value === password) {
                sessionStorage.setItem('adminOk', 'si');
                document.getElementById('login').style.display = 'none';
                document.getElementById('admin').style.display = 'block';
                renderProds();
                cargar();
            } else {
                alert('Contraseña incorrecta');
            }
        }
        
        function cerrar() {
            sessionStorage.removeItem('adminOk');
            location.reload();
        }
        
        function renderProds() {
            const ps = getProductos();
            document.getElementById('lista-prods').innerHTML = ps.map((p,i) =>
                '<div class="prod"><b>'+p.nombre+'</b><br>'+p.precio+'€<br><small>'+p.categoria+'</small><br><button onclick="borrarProd('+i+')" class="btn-rojo">🗑️</button></div>'
            ).join('');
        }
        
        function nuevoProd() {
            const nombre = document.getElementById('new-nombre').value;
            const precio = parseFloat(document.getElementById('new-precio').value);
            if (!nombre || !precio) return alert('Faltan datos');
            const ps = getProductos();
            ps.push({id:Date.now(), nombre, precio, categoria:document.getElementById('new-cat').value, imagen:document.getElementById('new-img').value||'img/'+nombre.toLowerCase().replace(/ /g,'')+'.jpg'});
            guardarProds(ps);
            alert('Guardado');
            document.getElementById('new-nombre').value = '';
            document.getElementById('new-precio').value = '';
            renderProds();
        }
        
        function borrarProd(i) {
            if (confirm('Borrar?')) {
                const ps = getProductos();
                ps.splice(i, 1);
                guardarProds(ps);
                renderProds();
            }
        }
        
        function cargar() {
            const pedidos = JSON.parse(localStorage.getItem('pedidos') || '[]');
            const div = document.getElementById('pedidos');
            if (pedidos.length === 0) {
                div.innerHTML = '<p>No hay pedidos</p>';
                return;
            }
            div.innerHTML = pedidos.map((p,i) =>
                '<div class="pedido"><strong>'+p.nombre+'</strong> - '+p.telefono+'<br>📧 '+(p.email||'-')+'<br>📍 '+p.direccion+'<br>📅 '+new Date(p.fecha||Date.now()).toLocaleString()+'<hr>'+(p.productos||[]).map(pr=>'<div>'+pr+'</div>').join('')+'<div style="margin-top:10px;font-weight:bold;">Total: '+Number(p.total||0).toFixed(2)+'€</div><button onclick="borrarPedido('+i+')" class="btn-rojo">🗑️</button></div>'
            ).join('');
        }
        
        function borrarPedido(i) {
            if (confirm('Borrar pedido?')) {
                const pedidos = JSON.parse(localStorage.getItem('pedidos') || '[]');
                pedidos.splice(i, 1);
                localStorage.setItem('pedidos', JSON.stringify(pedidos));
                cargar();
            }
        }
        
        function limpiarTodo() {
            if (confirm('Borrar TODOS los pedidos?')) {
                localStorage.removeItem('pedidos');
                cargar();
            }
        }
        
        // Check session
        if (sessionStorage.getItem('adminOk') === 'si') {
            document.getElementById('login').style.display = 'none';
            document.getElementById('admin').style.display = 'block';
            renderProds();
            cargar();
        }
    </script>
</body>
</html>
