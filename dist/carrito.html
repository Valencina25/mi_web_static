<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Huerto de Juan</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
    <script src="./script.js" defer></script>
  <link rel="stylesheet" crossorigin href="/assets/style-_OHi6M75.css">
</head>

<body>
    <div id="flash-container" class="flash-messages" role="alert" aria-live="polite"></div>

    <header class="header" role="banner">
        <div class="container">
            <a href="index.html" class="logo">🛒 Carrito</a>
            <nav class="nav-list" style="display: flex; gap: var(--space-md);">
                <a href="index.html" class="nav-link">🏠 Tienda</a>
            </nav>
        </div>
    </header>

    <main class="section">
        <div class="container">
            <h1 class="section-title">🛒 Tu Carrito</h1>

            <div class="productos-grid" id="carrito-container" style="max-width: 800px; margin: 0 auto;">
            </div>

            <div id="carrito-total" style="text-align: center; margin: var(--space-xl) 0;">
                <p class="producto-precio">Total: <span id="carrito-total-amount">0</span> €</p>

                <div style="display: flex; gap: var(--space-md); justify-content: center; margin-top: var(--space-lg); flex-wrap: wrap;">
                    <a href="checkout.html" class="btn btn-primary" id="checkout-link">💳 Finalizar Compra</a>
                    <button type="button" class="btn btn-outline" onclick="vaciarCarrito(); renderCarrito();">🗑️ Vaciar</button>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
